name: nightly

on:
  schedule:
    # 每天 UTC 16:00，北京时间次日 0 点
    - cron: '0 16 * * *'
  workflow_dispatch:
    inputs:
      force_all:
        description: '忽略已有 Release，重编全部 5.x 版本'
        required: false
        default: false
        type: boolean
      only_versions:
        description: '只编这些版本，逗号分隔（如 5.5.1,5.4.9）'
        required: false
        default: ''
        type: string

permissions:
  contents: write
  actions: write

concurrency:
  group: nightly
  cancel-in-progress: false

jobs:
  # ================================================================ 发现待编版本
  discover:
    runs-on: ubuntu-latest
    outputs:
      versions: ${{ steps.d.outputs.versions }}
      has_new: ${{ steps.d.outputs.has_new }}
      latest: ${{ steps.d.outputs.latest }}
    steps:
      - uses: actions/checkout@v7

      - name: Discover upstream versions
        id: d
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu

          # 手动指定了版本列表，直接用
          ONLY="${{ github.event.inputs.only_versions }}"
          if [ -n "$ONLY" ]; then
            JSON="["
            for v in $(printf '%s' "$ONLY" | tr ',' ' '); do
              [ "$JSON" = "[" ] || JSON="$JSON,"
              JSON="$JSON\"$v\""
            done
            JSON="$JSON]"
            echo "versions=$JSON" >> "$GITHUB_OUTPUT"
            echo "has_new=true" >> "$GITHUB_OUTPUT"
            echo "手动指定: $JSON" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # 强制全量：把官网列表整个塞回去
          if [ "${{ github.event.inputs.force_all }}" = "true" ]; then
            INDEX=$(curl -fsSL https://www.lua.org/ftp/ \
              | grep -oE 'lua-5\.[0-9]+(\.[0-9]+)?\.tar\.gz' \
              | sed 's/^lua-//; s/\.tar\.gz$//' | sort -u -V)
            JSON="["
            for v in $INDEX; do
              [ "$JSON" = "[" ] || JSON="$JSON,"
              JSON="$JSON\"$v\""
            done
            JSON="$JSON]"
            echo "versions=$JSON" >> "$GITHUB_OUTPUT"
            echo "has_new=true" >> "$GITHUB_OUTPUT"
            echo "最新: $(printf '%s\n' "$INDEX" | tail -1)" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          sh scripts/discover-versions.sh

      - name: Summary
        run: |
          {
            echo "### 待构建版本"
            echo ""
            echo '```'
            echo "${{ steps.d.outputs.versions }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # ================================================================ 分发给各版本
  dispatch:
    needs: discover
    if: needs.discover.outputs.has_new == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger build per version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          VERSIONS='${{ needs.discover.outputs.versions }}'
          echo "版本列表: $VERSIONS"

          # 逐版本调用 build.yml。
          # 不用 matrix 直接调：workflow_call 在 matrix 里每个组合都会
          # 独立跑一遍整套 job，重复开销大。这里用 gh workflow run 逐个触发，
          # 每个版本一条独立的 workflow run，互不影响，也方便单独重跑。
          for v in $(printf '%s' "$VERSIONS" | tr -d '[]"' | tr ',' ' '); do
            [ -n "$v" ] || continue
            echo "触发 $v"
            gh workflow run build.yml \
              --repo "$GITHUB_REPOSITORY" \
              --field version="$v" \
              --ref main
            # 避免触发过快被限流
            sleep 5
          done

          {
            echo "### 已触发构建"
            echo ""
            for v in $(printf '%s' "$VERSIONS" | tr -d '[]"' | tr ',' ' '); do
              [ -n "$v" ] && echo "- $v"
            done
          } >> "$GITHUB_STEP_SUMMARY"

  # ================================================================ 标记 latest
  # build.yml 里 make_latest 设成了 false，避免每个版本发布时都抢 Latest
  # （nightly 按版本号顺序批量构建，最后跑完的往往不是最新版本）。
  # 这里在所有构建结束后，按语义版本排序取最大的一个，单独设一次。
  mark-latest:
    needs: [discover, dispatch]
    if: needs.discover.outputs.has_new == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Wait for triggered builds
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          VERSIONS='${{ needs.discover.outputs.versions }}'
          echo "等待这些版本的构建完成: $VERSIONS"

          # 最多等 60 分钟。每个版本全套约 5 分钟，29 个版本并行约 25 分钟。
          for i in $(seq 1 120); do
            RUNNING=0
            for v in $(printf '%s' "$VERSIONS" | tr -d '[]"' | tr ',' ' '); do
              [ -n "$v" ] || continue
              # 该 tag 的 Release 还不存在就再等
              if ! gh release view "v$v" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
                RUNNING=1
                break
              fi
            done
            if [ "$RUNNING" = "0" ]; then
              echo "全部版本已发布"
              break
            fi
            echo "[$i/120] 还有版本未发布，等待 30 秒"
            sleep 30
          done

      - name: Set latest release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu

          # 取所有已有 Release 的 tag，按语义版本排序，最大者设为 latest
          ALL=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 200 \
                  --json tagName --jq '.[].tagName' \
                | sed 's/^v//' | sort -u -V)

          if [ -z "$ALL" ]; then
            echo "没有 Release，跳过" 
            exit 0
          fi

          NEWEST=$(printf '%s\n' "$ALL" | tail -1)
          echo "最新版本: $NEWEST"

          # gh release edit 的 --latest 会把标记从别的 Release 移过来
          gh release edit "v$NEWEST" --repo "$GITHUB_REPOSITORY" --latest

          {
            echo "### Latest 标记"
            echo ""
            echo "已把 \`v$NEWEST\` 设为 latest"
          } >> "$GITHUB_STEP_SUMMARY"

  # ================================================================ 汇总
  report:
    needs: [discover, dispatch, mark-latest]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Report
        run: |
          {
            echo "### 定时检查结果"
            echo ""
            echo "- 最新上游版本: \`${{ needs.discover.outputs.latest }}\`"
            echo "- 待构建: \`${{ needs.discover.outputs.has_new }}\`"
            echo "- 列表: \`${{ needs.discover.outputs.versions }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
