name: build

on:
  # 每天由 nightly.yml 检查上游，发现新版本就逐个触发本 workflow
  push:
    tags: ['v*']

  pull_request:

  workflow_dispatch:
    inputs:
      version:
        description: 'Lua 版本，如 5.5.1'
        required: true
        default: '5.5.1'
      no_release:
        description: '只构建不发布'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

env:
  # 手动触发时用 input，tag 推送时为空（由 setup 从 tag 名解析）
  LUA_VERSION: ${{ github.event.inputs.version || '' }}

jobs:
  # ================================================================ 解析版本
  # 单点确定版本号和是否发布，后续 job 都从这里取。
  setup:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      release: ${{ steps.v.outputs.release }}
    steps:
      - name: Resolve version
        id: v
        run: |
          set -eu

          if [ -n "${LUA_VERSION}" ]; then
            VERSION="${LUA_VERSION}"
          elif [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            echo "无法确定版本号" >&2
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          # 发布条件：tag 推送，或手动触发且没勾不发布。PR 永远不发布。
          RELEASE=false
          if [ "${GITHUB_EVENT_NAME}" = "push" ] && [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            RELEASE=true
          elif [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ] && [ "${{ github.event.inputs.no_release }}" != "true" ]; then
            RELEASE=true
          fi
          echo "release=$RELEASE" >> "$GITHUB_OUTPUT"

          {
            echo "### Lua ${VERSION}"
            echo ""
            echo "| 项 | 值 |"
            echo "|---|---|"
            echo "| 版本 | \`${VERSION}\` |"
            echo "| 触发 | \`${GITHUB_EVENT_NAME}\` |"
            echo "| 发布 | \`${RELEASE}\` |"
          } >> "$GITHUB_STEP_SUMMARY"

  # ================================================================ 源码
  # 单点下载 + 计算 sha256，其余 job 复用同一份源码与哈希。
  source:
    needs: setup
    runs-on: ubuntu-latest
    outputs:
      sha256: ${{ steps.sha.outputs.sha256 }}
      version: ${{ needs.setup.outputs.version }}
    steps:
      - name: Download upstream tarball
        run: |
          set -eu
          curl -fsSL -O "https://www.lua.org/ftp/lua-${{ needs.setup.outputs.version }}.tar.gz"
          ls -la lua-*.tar.gz

      - name: Compute sha256
        id: sha
        run: |
          set -eu
          F="lua-${{ needs.setup.outputs.version }}.tar.gz"
          SHA=$(sha256sum "$F" | cut -d' ' -f1)
          echo "sha256=$SHA" >> "$GITHUB_OUTPUT"
          echo "| 源码 sha256 | \`$SHA\` |" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        with:
          name: lua-src-${{ needs.setup.outputs.version }}
          path: lua-*.tar.gz
          retention-days: 1

  # ================================================================ macOS
  build-macos:
    needs: [setup, source]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest    # Apple Silicon
            arch: arm64
          - os: macos-26-intel  # Intel
            arch: x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: lua-src-${{ needs.setup.outputs.version }}
          path: work

      - name: Build, test, package
        env:
          EXPECTED_SHA256: ${{ needs.source.outputs.sha256 }}
          MACOSX_DEPLOYMENT_TARGET: '11.0'
          ARCH: ${{ matrix.arch }}
        run: |
          sh scripts/build-unix.sh \
            "${{ needs.setup.outputs.version }}" \
            macos "$PWD/dist" "$PWD/work"

      - name: Verify artifacts
        run: |
          set -eu
          V="${{ needs.setup.outputs.version }}"
          echo "== 产物 =="
          ls -lh dist/

          echo "== 解压并运行 =="
          rm -rf verify && mkdir verify
          tar -C verify -xzf "dist/lua-${V}-macos-${{ matrix.arch }}.tar.gz"
          ./verify/bin/lua -v
          ./verify/bin/lua -e 'print("ok:", _VERSION)'
          file ./verify/bin/lua

          echo "== 架构 =="
          case "${{ matrix.arch }}" in
            arm64) file ./verify/bin/lua | grep -q 'arm64' ;;
            x64)   file ./verify/bin/lua | grep -q 'x86_64' ;;
          esac

          echo "== 部署目标 =="
          MINOS=$(otool -l ./verify/bin/lua | awk '/LC_BUILD_VERSION/{f=1} f&&/minos/{print $2; exit}')
          echo "minos=$MINOS"
          [ "${MINOS%%.*}" -le 11 ]

          echo "== pkg =="
          if ls dist/*.pkg >/dev/null 2>&1; then
            PKG=$(ls dist/*.pkg | head -1)
            pkgutil --payload-files "$PKG" | head -25
            pkgutil --payload-files "$PKG" | grep -q 'usr/local/bin/lua'
            pkgutil --payload-files "$PKG" | grep -qi 'LICENSE'
            rm -rf pkgx && pkgutil --expand "$PKG" pkgx
            HOSTARCH=$(grep -o 'hostArchitectures="[^"]*"' pkgx/Distribution | head -1)
            echo "$HOSTARCH"
            case "${{ matrix.arch }}" in
              arm64) echo "$HOSTARCH" | grep -q 'arm64' ;;
              x64)   echo "$HOSTARCH" | grep -q 'x86_64' ;;
            esac
            echo "pkg 校验通过"
          else
            echo "本 job 未产出 pkg"
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: lua-${{ needs.setup.outputs.version }}-macos-${{ matrix.arch }}
          path: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256
            dist/*.pkg
            dist/*.pkg.sha256
          retention-days: 7

  # ================================================================ Windows
  build-windows:
    needs: [setup, source]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            msystem: UCRT64
            arch: x64
            gccpkg: mingw-w64-ucrt-x86_64-gcc
            innoarch: x64compatible
          - os: windows-11-arm
            msystem: CLANGARM64
            arch: arm64
            gccpkg: mingw-w64-clang-aarch64-gcc-compat
            innoarch: arm64
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: lua-src-${{ needs.setup.outputs.version }}
          path: work

      - uses: msys2/setup-msys2@v2
        with:
          msystem: ${{ matrix.msystem }}
          update: false
          install: >-
            base-devel
            ${{ matrix.gccpkg }}
            zip
            curl
            perl

      - name: Build, test, package
        env:
          EXPECTED_SHA256: ${{ needs.source.outputs.sha256 }}
          ARCH: ${{ matrix.arch }}
        run: |
          sh scripts/build-windows.sh \
            "${{ needs.setup.outputs.version }}" \
            "$PWD/dist" "$PWD/work"

      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $envFile = 'dist\pkg-input.env'
          if (-not (Test-Path $envFile)) { throw "缺少 $envFile" }

          $vars = @{}
          Get-Content $envFile | ForEach-Object {
            if ($_ -match '^([^=]+)=(.*)$') { $vars[$matches[1]] = $matches[2] }
          }
          $stage = $vars['LUABIN_STAGE']
          $tag   = $vars['LUABIN_TAG']
          Write-Host "stage=$stage"
          Write-Host "tag=$tag"
          if (-not (Test-Path $stage)) { throw "stage 目录不存在: $stage" }

          $iscc = @(
            'C:\Program Files (x86)\Inno Setup 6\ISCC.exe',
            'C:\Program Files\Inno Setup 6\ISCC.exe'
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) {
            $cmd = Get-Command iscc.exe -ErrorAction SilentlyContinue
            if ($cmd) { $iscc = $cmd.Source }
          }
          if (-not $iscc) { throw "找不到 ISCC.exe（Inno Setup）" }
          Write-Host "ISCC=$iscc"

          $outDir = (Resolve-Path 'dist').Path
          & $iscc `
            "/DStageDir=$stage" `
            "/DTag=$tag" `
            "/DVersion=$($vars['LUABIN_VERSION'])" `
            "/DArch=$($vars['LUABIN_ARCH'])" `
            "/DInnoArch=${{ matrix.innoarch }}" `
            "/DDLLName=$($vars['LUABIN_DLL'])" `
            "/DLangVer=$($vars['LUABIN_LANG'])" `
            "/DOutDir=$outDir" `
            'packaging\luabin.iss'

          if ($LASTEXITCODE -ne 0) { throw "ISCC 编译失败，退出码 $LASTEXITCODE" }

          $setup = Get-ChildItem dist\*-setup.exe | Select-Object -First 1
          if (-not $setup) { throw "没有生成 setup.exe" }
          Write-Host "安装包: $($setup.Name) ($([math]::Round($setup.Length/1MB,2)) MB)"

          $hash = (Get-FileHash $setup.FullName -Algorithm SHA256).Hash.ToLower()
          "$hash  $($setup.Name)" | Out-File -FilePath "$($setup.FullName).sha256" -Encoding ascii -NoNewline

      - name: Verify artifacts
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Write-Host '== 产物 =='
          Get-ChildItem dist | Format-Table Name, Length

          $zip = Get-ChildItem 'dist\*.zip' | Select-Object -First 1
          if (-not $zip) { throw '没有生成 zip' }
          Remove-Item verify -Recurse -Force -ErrorAction SilentlyContinue
          Expand-Archive -Path $zip.FullName -DestinationPath verify -Force

          & .\verify\bin\lua.exe -v
          & .\verify\bin\lua.exe -e "print('ok:', _VERSION)"
          if ($LASTEXITCODE -ne 0) { throw 'lua.exe 运行失败' }

          $setup = Get-ChildItem 'dist\*-setup.exe' | Select-Object -First 1
          if (-not $setup) { throw '缺少 setup.exe' }

          $target = Join-Path $env:RUNNER_TEMP "lua-install-test"
          $proc = Start-Process -FilePath $setup.FullName -Wait -PassThru `
            -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/DIR=$target"
          if ($proc.ExitCode -ne 0) { throw "安装器退出码 $($proc.ExitCode)" }

          $installedLua = Join-Path $target 'bin\lua.exe'
          if (-not (Test-Path $installedLua)) { throw "安装后找不到 $installedLua" }
          & $installedLua -v
          & $installedLua -e "print('installed ok:', _VERSION)"

      - uses: actions/upload-artifact@v7
        with:
          name: lua-${{ needs.setup.outputs.version }}-windows-${{ matrix.arch }}
          path: |
            dist/*.zip
            dist/*.zip.sha256
            dist/*-setup.exe
            dist/*-setup.exe.sha256
          retention-days: 7

  # ================================================================ Linux 脚本验证
  # 5.2 起有官方测试套件，5.0/5.1 只验证能编出来
  verify-linux:
    needs: setup
    runs-on: ubuntu-latest
    container: debian:bookworm-slim
    steps:
      - name: Install build tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential curl ca-certificates perl git tar gzip

      - uses: actions/checkout@v7

      - name: Build from source
        env:
          LUABIN_LOCAL_SRC: ""
        run: |
          set -eu
          sh scripts/build-linux.sh "${{ needs.setup.outputs.version }}" "$RUNNER_TEMP/prefix"

      - name: Verify installed tree
        run: |
          set -eu
          P="$RUNNER_TEMP/prefix"
          "$P/bin/lua" -v
          "$P/bin/lua" -e 'print("ok:", _VERSION)'
          test -f "$P/include/lua.h"
          test -f "$P/lib/liblua.a"
          printf '#include <lua.h>\nint main(void){return 0;}\n' > /tmp/t.c
          cc /tmp/t.c -I"$P/include" -L"$P/lib" -llua -lm -o /tmp/t
          /tmp/t && echo "static lib link ok"

  # ================================================================ 发布
  release:
    if: needs.setup.outputs.release == 'true'
    needs: [setup, build-macos, build-windows, verify-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Collect and checksum
        run: |
          set -eu
          V="${{ needs.setup.outputs.version }}"
          mkdir -p out

          # 排除源码包：lua-<version>.tar.gz 与产物通配相同
          SRC_PKG="lua-${V}.tar.gz"
          find artifacts -type f \
            \( -name '*.tar.gz' -o -name '*.zip' -o -name '*.pkg' -o -name '*-setup.exe' \) \
            ! -name "$SRC_PKG" \
            -exec cp {} out/ \;
          find artifacts -type f -name '*.sha256' -exec cp {} out/ \;
          rm -f "out/$SRC_PKG"

          cd out
          for f in *.sha256; do
            [ -f "$f" ] || continue
            base="${f%.sha256}"
            [ -f "$base" ] || { rm -f "$f"; continue; }
            sha256sum "$base" > "$f.tmp" && mv "$f.tmp" "$f"
          done

          ls -lh
          sha256sum *.tar.gz *.zip *.pkg *-setup.exe > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Write release notes
        run: |
          set -eu
          V="${{ needs.setup.outputs.version }}"
          SERIES="${V%.*}"
          cat > notes.md <<EOF
          ## Lua ${V}

          从 [lua.org](https://www.lua.org/ftp/) 官方源码构建。

          ### macOS

          \`.tar.gz\` 解压即用，\`.pkg\` 安装到 \`/usr/local\`。

          \`\`\`sh
          curl -fsSL https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/main/install.sh | sh -s ${V}
          \`\`\`

          ### Windows

          \`.zip\` 解压即用，\`-setup.exe\` 走安装向导。

          \`\`\`powershell
          \$env:LUABIN_VERSION='${V}'
          irm https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/main/install.ps1 | iex
          \`\`\`

          ### Linux

          不发预编译包，现场编译。

          \`\`\`sh
          curl -fsSL https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/main/scripts/build-linux.sh | sh -s ${V}
          \`\`\`

          ### 说明

          macOS 的 \`.pkg\` 和 Windows 的 \`-setup.exe\` 均未签名。macOS 浏览器下载的会被 Gatekeeper 拦截，用安装脚本（curl 不带 quarantine 标记）可避免。Windows 会弹 SmartScreen，点「更多信息 → 仍要运行」。

          每个文件附 \`.sha256\`，另有汇总的 \`SHA256SUMS.txt\`。
          EOF
          cat notes.md

      # make_latest 必须是 false。
      #
      # 默认 true 意味着每次发布都把 "Latest" 标记抢到刚发的那个版本上。
      # nightly 会按版本号顺序批量构建，最后跑完的那个（往往不是最新版本）
      # 就会占住 Latest，仓库首页显示的版本号因此是错的。
      #
      # 真正的 latest 由单独的 mark-latest job 在全部构建结束后设一次。
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ needs.setup.outputs.version }}
          name: Lua ${{ needs.setup.outputs.version }}
          files: out/*
          body_path: notes.md
          generate_release_notes: false
          fail_on_unmatched_files: true
          make_latest: false
